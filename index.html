.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;feeder-network&quot;&gt;
  &lt;style&gt;
    #feeder-network {
      display: flex;
      width: 100%;
      min-width: 0;
      flex-direction: column;
      gap: 12px;
      color: var(--foreground);
    }
    #feeder-network .network-shell {
      display: grid;
      min-width: 0;
      grid-template-columns: minmax(0, 1fr) minmax(250px, 300px);
      gap: 12px;
      align-items: stretch;
    }
    #feeder-network .topology-region {
      position: relative;
      min-width: 0;
      overflow: hidden;
    }
    #feeder-network .topology-svg {
      width: 100%;
      height: 620px;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }
    #feeder-network .topology-svg.is-panning {
      cursor: grabbing;
    }
    #feeder-network .branch {
      stroke: color-mix(in srgb, var(--foreground) 20%, transparent);
      stroke-width: 1.4;
      vector-effect: non-scaling-stroke;
    }
    #feeder-network .source-branch {
      stroke: color-mix(in srgb, var(--foreground) 42%, transparent);
      stroke-width: 1.8;
    }
    #feeder-network .paper-branch {
      stroke: var(--viz-series-1);
      stroke-width: 2.2;
    }
    #feeder-network.hide-paper-highlight .paper-branch {
      stroke: color-mix(in srgb, var(--foreground) 20%, transparent);
      stroke-width: 1.4;
    }
    #feeder-network .sop-link {
      fill: none;
      stroke: var(--viz-series-4);
      stroke-width: 2.4;
      stroke-dasharray: 8 6;
      vector-effect: non-scaling-stroke;
    }
    #feeder-network .network-node {
      cursor: pointer;
    }
    #feeder-network .network-node .node-mark {
      fill: var(--secondary);
      stroke: color-mix(in srgb, var(--foreground) 38%, transparent);
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
    }
    #feeder-network .network-node.paper-node .node-mark {
      fill: color-mix(in srgb, var(--viz-series-1) 18%, var(--background));
      stroke: var(--viz-series-1);
      stroke-width: 1.8;
    }
    #feeder-network.hide-paper-highlight .network-node.paper-node .node-mark {
      fill: var(--secondary);
      stroke: color-mix(in srgb, var(--foreground) 38%, transparent);
      stroke-width: 1.2;
    }
    #feeder-network .network-node.has-renewable .node-mark,
    #feeder-network.hide-paper-highlight .network-node.paper-node.has-renewable .node-mark {
      fill: color-mix(in srgb, var(--viz-series-3) 32%, var(--background));
      stroke: var(--viz-series-3);
    }
    #feeder-network .network-node.is-selected .node-mark {
      stroke: var(--foreground) !important;
      stroke-width: 3 !important;
    }
    #feeder-network .candidate-tie-halo {
      fill: none;
      stroke: var(--viz-series-5);
      stroke-width: 2.2;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }
    #feeder-network.hide-candidate-tie-points .candidate-tie-halo {
      display: none;
    }
    #feeder-network .node-hit {
      fill: transparent;
      stroke: none;
    }
    #feeder-network .node-label,
    #feeder-network .substation-label {
      fill: var(--foreground);
      stroke: var(--background);
      stroke-width: 3;
      paint-order: stroke;
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0;
      pointer-events: none;
    }
    #feeder-network .substation-mark {
      fill: var(--foreground);
      stroke: var(--background);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }
    #feeder-network .substation-label {
      font-size: 15px;
    }
    #feeder-network .topology-legend {
      position: absolute;
      right: 4px;
      bottom: 4px;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 12px;
      padding: 4px 6px;
      color: var(--foreground);
      background: color-mix(in srgb, var(--background) 86%, transparent);
      pointer-events: none;
    }
    #feeder-network .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    #feeder-network .legend-mark {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--secondary);
      border: 1px solid color-mix(in srgb, var(--foreground) 38%, transparent);
    }
    #feeder-network .legend-mark.paper {
      background: color-mix(in srgb, var(--viz-series-1) 18%, var(--background));
      border-color: var(--viz-series-1);
    }
    #feeder-network .legend-mark.renewable {
      background: color-mix(in srgb, var(--viz-series-3) 32%, var(--background));
      border-color: var(--viz-series-3);
    }
    #feeder-network .legend-mark.tie-point {
      border-radius: 0;
      background: transparent;
      border: 2px solid var(--viz-series-5);
      transform: rotate(45deg);
    }
    #feeder-network .legend-line {
      display: inline-block;
      width: 18px;
      border-top: 2px dashed var(--viz-series-4);
    }
    #feeder-network .node-detail {
      display: flex;
      min-width: 0;
      align-self: start;
      flex-direction: column;
      gap: 12px;
    }
    #feeder-network .node-heading {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #feeder-network .node-metrics {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 5px 12px;
      margin: 0;
    }
    #feeder-network .node-metrics dt {
      color: var(--muted-foreground);
    }
    #feeder-network .node-metrics dd {
      margin: 0;
      font-variant-numeric: tabular-nums;
      text-align: end;
      overflow-wrap: anywhere;
    }
    #feeder-network .chart-wrap {
      position: relative;
      min-width: 0;
    }
    #feeder-network .profile-chart {
      width: 100%;
      height: auto;
      overflow: visible;
    }
    #feeder-network .chart-grid {
      stroke: var(--border);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    #feeder-network .chart-axis-label {
      fill: var(--muted-foreground);
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0;
    }
    #feeder-network .load-line,
    #feeder-network .renewable-line {
      fill: none;
      stroke-width: 2.2;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    #feeder-network .load-line {
      stroke: var(--viz-series-2);
    }
    #feeder-network .renewable-line {
      stroke: var(--viz-series-3);
      stroke-dasharray: 5 3;
    }
    #feeder-network .chart-cursor {
      stroke: color-mix(in srgb, var(--foreground) 40%, transparent);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    #feeder-network .chart-tooltip {
      position: absolute;
      visibility: hidden;
      pointer-events: none;
    }
    #feeder-network .series-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
    }
    #feeder-network .series-swatch {
      display: inline-block;
      width: 16px;
      border-top: 2px solid var(--viz-series-2);
    }
    #feeder-network .series-swatch.renewable {
      border-color: var(--viz-series-3);
      border-top-style: dashed;
    }
    @media (max-width: 900px) {
      #feeder-network .network-shell {
        grid-template-columns: 1fr;
      }
      #feeder-network .topology-svg {
        height: 430px;
      }
      #feeder-network .node-detail {
        min-height: 0;
      }
    }
  &lt;/style&gt;

  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Topology display controls&quot;&gt;

  &lt;script&gt;
    (() =&gt; {
